services:
  mira:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--allow-unconfigured"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MIRA_INDEX_DIR: /app/data/indexes
    volumes:
      - mira-data:/app/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  mira-data:
